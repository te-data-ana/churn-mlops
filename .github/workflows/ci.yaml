name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install all dependency groups
        run: uv sync --locked --all-groups

      - name: Generate dependency license report
        run: uv run pip-licenses --format=json --output-file=license-report.json

      - name: Check dependency licenses
        run: uv run python scripts/check_licenses.py license-report.json

      - name: Upload dependency license report
        if: ${{ always() && hashFiles('license-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-report
          path: license-report.json
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          config-file: .github/dependency-review-config.yml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q
