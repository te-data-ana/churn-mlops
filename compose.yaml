services:
  api:
    build:
      context: .
    image: churn-mlops:local
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/tracking/mlflow.db}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-test}
      MODEL_NAME: ${MODEL_NAME:-churn-propensity}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GIT_PYTHON_REFRESH: ${GIT_PYTHON_REFRESH:-quiet}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      LOG_FEATURES: ${LOG_FEATURES:-True}
      ARTIFACT_DIR: ${ARTIFACT_DIR:-/app/artifacts}
      TRACKING_DIR: ${TRACKING_DIR:-/app/tracking}
      RAW_DATA_DIR: ${RAW_DATA_DIR:-/app/data/raw}
      CONFIG_DIR: ${CONFIG_DIR:-/app/src/config}
      TMP_DIR: ${TMP_DIR:-/app/tmp}
      LOGGING_DIR: ${LOGGING_DIR:-/app/logs}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./tracking:/app/tracking
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./data/raw:/app/data/raw:ro
      - ./src/config:/app/src/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
