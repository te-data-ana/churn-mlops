[project]
name = "churn-mlops"
version = "0.3.0"
description = "MLops project based on churn propensity use case, to evolve and demonstrate my ML engineering skills"
readme = "README.md"
# fixing to earlier verison, as required packages are not compatible with newer versions
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    # Temporary pin required because uv resolves kaleido 0.2.1.post1,
    # which currently lacks a compatible wheel for Linux x86_64.
    "kaleido==0.2.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "nannyml>=0.13.1",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "pandera>=0.33.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
churn-mlops = "churn_mlops:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "dvc>=3.67.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/churn_mlops",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: fast isolated tests",
    "smoke: quick integration tests",
    "integration: end-to-end workflow tests",
]
