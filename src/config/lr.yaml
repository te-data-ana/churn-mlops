data:
  target_column: churn

feature_builder:
  feature_params:
    engagement_window: 30
    inactive_threshold: 15
    late_payer_threshold: 15

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

model:
  classifier: lr
  classifier_params:
    random_state: 26
    max_iter: 200

evaluation:
  threshold: 0.5

registry:
  register_model: false
  registry_params:
    model_name: churn-risk
    alias: candidate
    promotion_delta: 0.005

tuning:
  enabled: true
  n_trials: 25
  n_splits: 4
  time_column: reference_date
  metric: roc_auc
  random_state: 26
