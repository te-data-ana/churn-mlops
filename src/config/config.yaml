data:
  target_column: churn

feature_builder:
  feature_params:
    engagement_window: 30
    inactive_threshold: 15
    late_payer_threshold: 15

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

model:
  classifier: dc
  classifier_params:
    random_state: 26

evaluation:
  threshold: 0.5

registry:
  register_model: false
  registry_params:
    model_name: churn-propensity
    alias: candidate
    promotion_delta: 0.01
