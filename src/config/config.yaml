model:
  classifier: dc
  classifier_params:
    random_state: 26

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

calibration:
  n_splits: 3
  n_bins: 10

threshold:
  strategy: max_f1

promotion:
  min_delta: 0.01
  metric_weights:
    roc_auc: 0.2
    pr_auc: 0.2
    f1: 0.2
    brier_score: 0.2
    calibration_error: 0.2
