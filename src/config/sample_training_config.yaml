data:
  target_column: churn

feature_builder:
  feature_params:
    engagement_window: 30
    inactive_threshold: 15
    late_payer_threshold: 15

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

model:
  classifier: dc
  classifier_params:
    strategy: most_frequent

evaluation:
  threshold: 0.5

tuning:
  enabled: false
  n_trials: 50
  n_splits: 4
  time_column: reference_date
  metric: roc_auc
  random_state: 26

registry:
  register_model: true
  registry_params:
    model_name: churn-propensity
    alias: candidate
    promotion_delta: 0.005
