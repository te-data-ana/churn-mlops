model:
  classifier: dc
  classifier_params:
    strategy: most_frequent

data:
  target_column: churn
  time_column: reference_date

feature_builder:
  feature_params:
    engagement_window: 30
    inactive_threshold: 15
    late_payer_threshold: 15

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

tuning:
  enabled: false
  n_trials: 50
  n_splits: 4
  metric: roc_auc
  random_state: 26

calibration:
  method: none
  n_splits: 3
  n_bins: 10

threshold:
  strategy: max_f1

registry:
  register_model: true
  model_name: churn-risk
  alias: candidate

promotion:
  promote_model: true
  min_delta: 0.005
  metric_weights:
    roc_auc: 0.2
    pr_auc: 0.2
    f1: 0.2
    brier_score: 0.2
    calibration_error: 0.2
