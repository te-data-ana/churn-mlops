use_case: churn

model:
  classifier: dc
  classifier_params:
    strategy: most_frequent

preprocessing:
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

tuning:
  n_trials: 64
  n_splits: 4
  metric: roc_auc
  random_state: 26

calibration:
  n_splits: 3
  n_bins: 10

threshold:
  strategy: max_f1

registry:
  model_name: churn-risk
  alias: candidate

promotion:
  min_delta: 0.005
  metric_weights:
    roc_auc: 0.2
    pr_auc: 0.2
    f1: 0.2
    brier_score: 0.2
    calibration_error: 0.2
